name: Publish Fallout 2 Korean text engine beta 1.1.0

on:
  push:
    branches:
      - release/v1.1.0-beta.1

permissions:
  contents: write

jobs:
  package-and-prerelease:
    name: Test, build and publish isolated beta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned build requirements
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Execute all unit tests
        run: python -m unittest discover -s tests -v
      - name: Build developer package
        run: python tools/package_engine.py --output dist/korean-text-engine.zip
      - name: Build GUI installer
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Fallout2-Korean-Text-Engine-Setup
          --paths .
          --add-data "runtime-manifest.json;."
          --add-data "fallout2font.dll;."
          --add-data "fallout2font.ini;."
          --add-data "fonts;fonts"
          tools/gui_installer.py
      - name: Smoke test bundled GUI without touching any game
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "./dist/Fallout2-Korean-Text-Engine-Setup.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "The beta installer failed asset self-test." }
      - name: Write release checksums
        shell: pwsh
        run: |
          $files = @("dist/Fallout2-Korean-Text-Engine-Setup.exe", "dist/korean-text-engine.zip")
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $checksums | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding ascii
      - name: Upload independent beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-korean-text-engine-beta-1-1-0
          path: |
            dist/Fallout2-Korean-Text-Engine-Setup.exe
            dist/korean-text-engine.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish v1.1.0-beta.1 GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.1.0-beta.1"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to overwrite published assets."
          }
          gh release create $tag `
            "dist/Fallout2-Korean-Text-Engine-Setup.exe" `
            "dist/korean-text-engine.zip" `
            "dist/SHA256SUMS.txt" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Fallout 2 Korean Text Engine v1.1.0-beta.1 (test build)" `
            --notes-file "docs/RELEASE_NOTES_BETA_1_1_0.md" `
            --prerelease `
            --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish the beta prerelease." }
