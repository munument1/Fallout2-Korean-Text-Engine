name: Build and release standalone Korean engine v1.2.1

on:
  pull_request:
    paths:
      - ".github/workflows/native-stable-release.yml"
      - "src/**"
      - "tools/**"
      - "tests/**"
      - "fonts/**"
      - "runtime-manifest.json"
      - "fallout2font.ini"
      - "docs/RELEASE_NOTES_V1_2_1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-stable-release.yml"
      - "src/**"
      - "tools/**"
      - "tests/**"
      - "fonts/**"
      - "runtime-manifest.json"
      - "fallout2font.ini"
      - "docs/RELEASE_NOTES_V1_2_1.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Unit-test installer, patcher and restore routines
        run: python -m unittest discover -s tests -v
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile independent x86 font engine and probes
        shell: cmd
        run: |
          if not exist build\standalone mkdir build\standalone
          cl /nologo /std:c++17 /EHsc /O2 /MT /LD /utf-8 /Fobuild\standalone\ src\font_standalone.cpp src\native_font_hooks.cpp /link /Brepro /DEF:src\font_bridge.def /OUT:build\standalone\fallout2font.dll gdi32.lib user32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /MT /utf-8 /Febuild\standalone\font_standalone_probe.exe tests\font_standalone_probe.cpp user32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /MT /utf-8 /Febuild\standalone\dialog_wrap_probe.exe tests\dialog_wrap_probe.cpp user32.lib
          if errorlevel 1 exit /b 1
      - name: Validate font ABI, Hangul glyphs and dialogue wrapping
        shell: pwsh
        run: |
          python tools/verify_native_bundle.py build/standalone/fallout2font.dll
          if ($LASTEXITCODE -ne 0) { throw "Native font DLL ABI validation failed" }
          Copy-Item fallout2font.ini build/standalone/fallout2font.ini
          New-Item -ItemType Directory build/standalone/fonts -Force | Out-Null
          Copy-Item fonts/Galmuri9.ttf build/standalone/fonts/Galmuri9.ttf
          Copy-Item fonts/Galmuri11.ttf build/standalone/fonts/Galmuri11.ttf
          & build/standalone/font_standalone_probe.exe (Resolve-Path build/standalone/fallout2font.dll).Path
          if ($LASTEXITCODE -ne 0) { throw "Hangul output probe failed" }
          python tests/generate_dialog_fixture.py build/standalone/dialog-fixture
          if ($LASTEXITCODE -ne 0) { throw "Dialogue fixture generation failed" }
          & build/standalone/dialog_wrap_probe.exe (Resolve-Path build/standalone/fallout2font.dll).Path (Resolve-Path build/standalone/dialog-fixture).Path 320
          if ($LASTEXITCODE -ne 0) { throw "Dialogue wrap probe failed" }
      - name: Package self-contained native Windows installer
        shell: pwsh
        run: |
          Copy-Item build/standalone/fallout2font.dll standalone-font.dll
          pyinstaller --noconfirm --clean --onefile --windowed --name Fallout2-Korean-Native-Setup --paths . --add-data "runtime-manifest.json;." --add-data "fallout2font.dll;." --add-data "fallout2font.ini;." --add-data "standalone-font.dll;." --add-data "fonts;fonts" tools/gui_installer.py
          if ($LASTEXITCODE -ne 0) { throw "Native installer packaging failed" }
      - name: Smoke-test packaged installer in native mode
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "./dist/Fallout2-Korean-Native-Setup.exe" -ArgumentList "--native-self-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged installer lacks its native DLL or expected assets" }
      - name: Package redistributable independent font and SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/native-font/fonts -Force | Out-Null
          Copy-Item build/standalone/fallout2font.dll dist/native-font/fallout2font.dll
          Copy-Item fallout2font.ini dist/native-font/fallout2font.ini
          Copy-Item fonts/Galmuri9.ttf dist/native-font/fonts/Galmuri9.ttf
          Copy-Item fonts/Galmuri11.ttf dist/native-font/fonts/Galmuri11.ttf
          Copy-Item fonts/Galmuri-LICENSE.txt dist/native-font/fonts/Galmuri-LICENSE.txt
          Compress-Archive -Path dist/native-font/* -DestinationPath dist/Independent-Korean-Native-Font.zip
          $artifacts = @("dist/Fallout2-Korean-Native-Setup.exe", "dist/Independent-Korean-Native-Font.zip")
          $checksums = foreach ($file in $artifacts) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $checksums | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload tested release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-korean-text-engine-native-v1-2-1
          path: |
            dist/Fallout2-Korean-Native-Setup.exe
            dist/Independent-Korean-Native-Font.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish stable v1.2.1 after all checks pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.2.1"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already published; keeping existing release assets."
            exit 0
          }
          gh release create $tag "dist/Fallout2-Korean-Native-Setup.exe" "dist/Independent-Korean-Native-Font.zip" "dist/SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Fallout 2 Korean Text Engine v1.2.1" --notes-file "docs/RELEASE_NOTES_V1_2_1.md" --latest
          if ($LASTEXITCODE -ne 0) { throw "Stable v1.2.1 publication failed" }
