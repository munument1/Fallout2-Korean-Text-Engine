name: Verify owned runtime and build package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile source without replacing the verified adapter
        shell: cmd
        run: |
          mkdir build
          cl /nologo /std:c++17 /EHsc /O2 /MT /LD /utf-8 /Fobuild\font_minimal.obj src\font_minimal.cpp /link /Brepro /DEF:src\font_bridge.def /OUT:build\source-check.dll gdi32.lib user32.lib
      - run: python tools/package_engine.py --output dist/korean-text-engine.zip
      - uses: actions/upload-artifact@v4
        with:
          name: korean-text-engine
          path: dist/korean-text-engine.zip
          if-no-files-found: error
