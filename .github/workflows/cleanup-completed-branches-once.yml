name: One-time verified branch cleanup (Fallout2-Korean-Text-Engine)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-completed-branches-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'munument1/Fallout2-Korean-Text-Engine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const items = [{"branch":"codex/ettu-2.0-validation","sha":"a98e347fe6379b23c20d08565557ccb857300294","pr":2,"base":"main"},{"branch":"codex/resurrection-profile","sha":"36693835c74a41261fa97d40ce2c106aab1726a8","pr":1,"base":"main"},{"branch":"codex/sonora-dev-profile","sha":"6eaa5298519eb42c4a05fbdfcbac7d8acfd01396","pr":3,"base":"main"},{"branch":"docs/fix-legacy-v100-link","sha":"4e88cc4d7d594634cf1ef9b7a50e048c4a5e2088","pr":14,"base":"main"},{"branch":"docs/native-beta2-all-six","sha":"c8f15da566642b80c3bd8d96b082d6cb068846ac","pr":15,"base":"main"},{"branch":"docs/native-beta2-entrypoint","sha":"6c44d804cec8e6ca15f44d8ddbf62563f89f121b","pr":13,"base":"main"},{"branch":"docs/resurrection-legacy-main-guidance","sha":"e5aec24e5510a4d591fb3df1ac59b64afb08ad7a","pr":17,"base":"main"},{"branch":"feature/decouple-sfall-korean-rendering","sha":"9a41e17a42474d81aee3555d5097e324a2f8e835","pr":4,"base":"main"},{"branch":"fix/preserve-full-card-description","sha":"6436394716d66c2a15fb7ee89fe83dfb8b4e4abf","pr":9,"base":"feature/selfcontained-korean-engine"},{"branch":"fix/rpu-intro-appearance","sha":"b7f2fef4b16297193d63beab5da22196dbec412b","pr":21,"base":"main"},{"branch":"fix/vanilla-ui-knob-95","sha":"bc6e76509a8032b2e16f790cd35e59db735c2953","pr":10,"base":"feature/selfcontained-korean-engine"},{"branch":"release/native-v1.2.0-final","sha":"2690d4571e015bce43c1440eff7220c0ce1ae4ff","pr":19,"base":"main"}];
            const owner=context.repo.owner, repo=context.repo.repo;
            if (owner!=='munument1'||repo!=="Fallout2-Korean-Text-Engine"||context.ref!=='refs/heads/main') throw Error('Wrong repository/ref');
            const openPRs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const blocked=new Set(openPRs.flatMap(p=>[p.head.ref,p.base.ref]));
            let deleted=0; const skipped=[];
            for(const item of items){
              if(item.branch==='main'||item.branch==='gh-pages'||blocked.has(item.branch)) {skipped.push(item.branch+': protected by policy/PR');continue;}
              const b=(await github.rest.repos.getBranch({owner,repo,branch:item.branch})).data;
              if(b.protected||b.commit.sha!==item.sha){skipped.push(item.branch+': ref changed/protected');continue;}
              if(item.pr!==null){
                const p=(await github.rest.pulls.get({owner,repo,pull_number:item.pr})).data;
                if(!p.merged_at||p.head.ref!==item.branch||p.head.sha!==item.sha||p.base.ref!==item.base){skipped.push(item.branch+': PR altered');continue;}
              }
              if(item.base!=='main'){
                const diff=(await github.rest.repos.compareCommitsWithBasehead({owner,repo,basehead:'main...'+item.branch})).data;
                if(diff.ahead_by!==0){skipped.push(item.branch+': unique commits');continue;}
              }
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+item.branch});
              deleted++;core.info('DELETED '+item.branch);
            }
            core.info('Branch cleanup: '+deleted+' deleted, '+skipped.length+' skipped from '+items.length+' candidates');
            for(const note of skipped)core.warning('SKIPPED '+note);
            await core.summary.addHeading('One-time branch cleanup').addRaw('Deleted '+deleted+' of '+items.length+'. Skipped '+skipped.length+'.').write();
